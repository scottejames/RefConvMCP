[project]
name = "refconv-mcp"
version = "0.1.0"
description = "MCP server: convert Ordnance Survey grid references to lat/long and fetch Google Street View images for them."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["MCP", "Ordnance Survey", "grid reference", "British National Grid", "Street View"]
dependencies = [
    "mcp >=1.16.0,<2",
    "httpx >=0.27.2",
    "pyproj >=3.6.0",
    "python-dotenv >=1.0.0",
]

[project.scripts]
refconv-mcp = "refconv_mcp.server:main"

[dependency-groups]
dev = ["pytest >=8.3.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/refconv_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
